# Configuration for CREME-Hybrid Prompt Sensitivity Mitigation Framework

project:
  name: "prompt-sensitivity-hybrid"
  seed: 42
  output_dir: "outputs/hybrid_framework"
  log_dir: "outputs/logs"

hardware:
  target_gpu: "NVIDIA GeForce RTX 4090"
  min_vram_gb: 24.0
  enforce_cuda: true

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  supported_models:
    - "Qwen/Qwen2.5-7B-Instruct"
    - "meta-llama/Llama-3.1-8B-Instruct"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  fallback_allowed: false

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

generation:
  max_new_tokens: 64
  do_sample: false
  temperature: 0.0

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0001
  max_seq_length: 2048
  fp16: false
  bf16: true

peft:
  enabled: true
  task_type: "CAUSAL_LM"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

dataset:
  data_path: "data/paraphrased_prompts_axis_tagged_qa.csv"
  splits_dir: "data/splits"
  cluster_key: "cluster_id"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  expected_clusters: 196
  expected_records: 1176
  source_csv: "data/paraphrased_prompts_axis_tagged_qa.csv"
  external_eval_dataset: "data/external_eval/external_dataset.jsonl"
  correctness_subset: "data/external_eval/correctness_subset.jsonl"

contrastive:
  temperature: 0.07
  pooling: "mean"
  layer_idx: -1
  lambda_task: 1.0
  lambda_con: 0.5
  lambda_pres: 1.0
  learning_rate: 0.0001
  batch_size: 4
  gradient_accumulation_steps: 4

creme_sensitivity:
  candidate_layers: [12, 16, 20, 24]
  causal_patch_layers: [16, 20, 24]
  sham_control: true

router:
  semantic_threshold: 0.50
  agreement_ratio_threshold: 0.80
  objective_weights:
    alpha: 0.35   # Consistency weight
    beta: 0.35    # Accuracy weight
    gamma: 0.15   # Preservation weight
    delta: 0.10   # Latency penalty
    eta: 0.05     # Resource cost penalty
